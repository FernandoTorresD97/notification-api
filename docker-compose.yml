services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-notification-db}
    volumes:
      - notification_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-notification}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-notification-broker}
    volumes:
      - notification_rabbitdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      TZ: UTC
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-local-notification-db}
      NOTIFICATION_DELIVERY_ENABLED: 'true'
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-notification}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-notification-broker}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: demo@example.invalid
      NOTIFICATION_ADMIN_USERNAME: ${NOTIFICATION_ADMIN_USERNAME:?Defina NOTIFICATION_ADMIN_USERNAME}
      NOTIFICATION_ADMIN_PASSWORD: ${NOTIFICATION_ADMIN_PASSWORD:?Defina NOTIFICATION_ADMIN_PASSWORD com pelo menos 16 caracteres}
      NOTIFICATION_INTEGRATION_USERNAME: ${NOTIFICATION_INTEGRATION_USERNAME:-artpizza}
      NOTIFICATION_INTEGRATION_PASSWORD: ${NOTIFICATION_INTEGRATION_PASSWORD:?Defina a senha da integração com pelo menos 16 caracteres}
    ports:
      - "127.0.0.1:8080:8080"
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - app
volumes:
  notification_pgdata:
  notification_rabbitdata:
