name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Require Docker for RabbitMQ integration tests
        run: docker info
      - name: Verify Java, PostgreSQL, SMTP and RabbitMQ
        run: mvn -B clean verify
      - name: Require RabbitMQ tests to run
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse('target/surefire-reports/TEST-com.portfolio.notificationapi.RabbitTransportIntegrationTest.xml').getroot()
          assert int(suite.attrib['tests']) == 3 and int(suite.attrib['skipped']) == 0, 'RabbitMQ tests were skipped'
          PY
      - name: Verify frontend syntax
        run: node --check frontend/app.js
      - name: Smoke test the packaged application and Swagger
        env:
          DB_HOST: localhost
          DB_PORT: '15432'
          DB_NAME: notification_smoke
          DB_USER: postgres
          DB_PASSWORD: smoke-only-password
          NOTIFICATION_DELIVERY_ENABLED: 'false'
        run: |
          set -euo pipefail
          app_pid=''
          cleanup() {
            if [ -n "$app_pid" ]; then kill "$app_pid" 2>/dev/null || true; fi
            docker rm -f notification-smoke-db >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name notification-smoke-db \
            -e POSTGRES_DB="$DB_NAME" -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            -p 127.0.0.1:15432:5432 postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec notification-smoke-db pg_isready -U postgres -d "$DB_NAME"; then break; fi
            sleep 2
          done
          java -jar target/notification-api.jar > /tmp/notification-smoke.log 2>&1 &
          app_pid=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/v3/api-docs > /tmp/notification-openapi.json; then
              curl --fail --silent http://localhost:8080/api/v1/channels
              test "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/notifications)" = '401'
              kill "$app_pid"
              wait "$app_pid" || true
              app_pid=''
              bash scripts/verify-migration.sh
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          cat /tmp/notification-smoke.log
          exit 1
